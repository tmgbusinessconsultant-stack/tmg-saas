name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tmg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tmg_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tmg_test
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tmg_test
      JWT_SECRET: ci-only-test-secret-with-at-least-32-characters
      PAYPAL_MODE: sandbox
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000/api
      NEXT_PUBLIC_PAYPAL_CLIENT_ID: ci-placeholder
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: frontend
      - name: Prepare isolated test database
        run: npx prisma db push
      - name: Backend typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Unit tests
        run: npm test
      - name: Backend build and HTTP E2E
        run: npm run test:e2e
      - name: Frontend typecheck
        run: npm run typecheck
        working-directory: frontend
      - name: Frontend lint
        run: npm run lint
        working-directory: frontend
      - name: Frontend production build
        run: npm run build
        working-directory: frontend
